syntax = "proto3";

package user.v1;

option go_package = "github.com/11SF/cap-common-proto/v1/user;userv1";

// UserService provides user management operations
service UserService {
  // CreateUser creates a new user account
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

  // GetUser retrieves user information by user ID
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // GetUserByEmail retrieves user information by email
  rpc GetUserByEmail(GetUserByEmailRequest) returns (GetUserResponse);

  // UpdateUser updates user information
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);

  // ValidateCredentials validates user credentials for login
  rpc ValidateCredentials(ValidateCredentialsRequest) returns (ValidateCredentialsResponse);

  // ListUsers returns a paged list of users (for admin/ops portal)
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  // GeneratePasswordResetToken creates a one-time reset token for a user
  // (admin-initiated — bypasses old password). Returns raw token ONCE.
  rpc GeneratePasswordResetToken(GeneratePasswordResetTokenRequest) returns (GeneratePasswordResetTokenResponse);

  // ResetPasswordWithToken validates a one-time token and sets a new password
  rpc ResetPasswordWithToken(ResetPasswordWithTokenRequest) returns (ResetPasswordWithTokenResponse);

  // DeleteUser permanently removes a user and all owned applications/clients
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}

// CreateUserRequest represents the create user request
message CreateUserRequest {
  string username = 1;
  string email = 2;
  string password = 3; // Will be hashed in the service
  string picture_profile = 4;
  map<string, string> custom_attributes = 5;
}

// CreateUserResponse represents the create user response
message CreateUserResponse {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string picture_profile = 4;
  string created_at = 5;
}

// GetUserRequest represents the get user request
message GetUserRequest {
  string user_id = 1;
}

// GetUserByEmailRequest represents the get user by email request
message GetUserByEmailRequest {
  string email = 1;
}

// GetUserResponse represents the user response
message GetUserResponse {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string picture_profile = 4;
  string password_hash = 5; // For internal use only
  string created_at = 6;
  string updated_at = 7;
  map<string, string> custom_attributes = 8;
}

// UpdateUserRequest represents the update user request
message UpdateUserRequest {
  string user_id = 1;
  string username = 2;
  string picture_profile = 3;
  map<string, string> custom_attributes = 4;
}

// UpdateUserResponse represents the update user response
message UpdateUserResponse {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string picture_profile = 4;
  string updated_at = 5;
}

// ValidateCredentialsRequest represents the validate credentials request
message ValidateCredentialsRequest {
  string email = 1;
  string password = 2;
}

// ValidateCredentialsResponse represents the validate credentials response
message ValidateCredentialsResponse {
  bool is_valid = 1;
  string user_id = 2;
  string username = 3;
  string email = 4;
  string picture_profile = 5;
}

// ListUsersRequest — paged search (search = username/email LIKE)
message ListUsersRequest {
  string search = 1;
  int32 page = 2;    // 1-based
  int32 limit = 3;   // default 50, max 200
}

// ListUsersResponse — paged user list
message ListUsersResponse {
  repeated GetUserResponse users = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

// GeneratePasswordResetTokenRequest — admin-initiated reset (bypass old password)
message GeneratePasswordResetTokenRequest {
  string user_id = 1;
}

// GeneratePasswordResetTokenResponse — raw token, shown ONCE
message GeneratePasswordResetTokenResponse {
  string reset_token = 1;
  string expires_at = 2; // RFC3339
}

// ResetPasswordWithTokenRequest — user sets new password with one-time token
message ResetPasswordWithTokenRequest {
  string reset_token = 1;
  string new_password = 2;
}

// ResetPasswordWithTokenResponse — success = password changed
message ResetPasswordWithTokenResponse {
  bool success = 1;
  string user_id = 2;
}

message DeleteUserRequest {
  string user_id = 1;
}

message DeleteUserResponse {
  bool success = 1;
  string user_id = 2;
  int32 deleted_apps = 3;    // apps ลูกที่ลบไปด้วย
  int32 deleted_clients = 4; // clients ลูกที่ลบไปด้วย
}
