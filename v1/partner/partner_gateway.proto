syntax = "proto3";

package partner.v1;

option go_package = "github.com/11SF/cap-common-proto/v1/partner;partnerv1";

// PartnerGatewayService is grpc-only, deliberately: nothing reaches it
// directly from a browser, and no other orchestrator calls it either - orch
// services call core/adaptor directly, never each other, same rule as core
// services never calling another core directly. A partner's backend calls
// these three RPCs directly; that's the only way in.
service PartnerGatewayService {
  // ExchangeToken redeems an authorization code for an access/refresh token
  // pair. Callable only by the partner's backend.
  rpc ExchangeToken(ExchangeTokenRequest) returns (ExchangeTokenResponse);

  // GetProfile returns the resource owner's profile for a valid access
  // token. Callable only by the partner's backend.
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);

  // RevokeToken invalidates an access token's underlying session. Callable
  // only by the partner's backend.
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);
}

message ExchangeTokenRequest {
  string code = 1;
  string client_id = 2;
  string client_secret = 3;
  string redirect_uri = 4;
}

message ExchangeTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;
  int64 expires_in = 4;
  UserInfo user_info = 5;
}

message UserInfo {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string picture_profile = 4;
}

message GetProfileRequest {
  string access_token = 1;
}

message GetProfileResponse {
  UserInfo user_info = 1;
}

message RevokeTokenRequest {
  string access_token = 1;
}

message RevokeTokenResponse {
  bool success = 1;
  string message = 2;
}
